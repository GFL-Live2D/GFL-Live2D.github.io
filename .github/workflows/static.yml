name: Build and deploy viewer

on:
  repository_dispatch:
    types: [viewer-push]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GFL-Live2D/viewer
          ref: ${{ github.event.client_payload.sha || 'main' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun ci

      - run: bun run build:static

      - name: Publish the standalone demos
        run: |
          mkdir -p build/demo
          cp standalone-demos/*.html build/demo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
